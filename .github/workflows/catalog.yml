name: Catalog

# Checks every pull request that touches the shared catalog (catalog/), and keeps catalog/index.json in step with the packs on main.
# The index is made by the script, never by hand: a donor adds one pack file and nothing else.

on:
  push:
    branches: [main]
    paths: ["catalog/**", "scripts/catalog*.ts"]
  pull_request:
    paths: ["catalog/**", "scripts/catalog*.ts"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/catalog.test.ts
      - run: bun scripts/catalog.ts

  index:
    # on main only: rewrite the index and commit it if it changed (the commit does not run this workflow again: the bot's push is ignored)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/catalog.ts --write
      - name: Commit the index
        run: |
          if git diff --quiet -- catalog/index.json; then exit 0; fi
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog/index.json
          git commit -m "catalog: refresh index.json"
          git push
